name: Refresh public market data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1-5' # 02:15 UTC, weekdays; data may lag US market close
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download public data
        run: python update_data.py
      - name: Commit refreshed snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update public market data snapshots"
            git push
          fi
